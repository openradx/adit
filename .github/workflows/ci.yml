name: Run Continuous Integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: "ubuntu-latest"
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        # Safe because the Docker build below is load-only and never pushed;
        # revisit if this workflow ever publishes an image or runs on tags.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 # zizmor: ignore[cache-poisoning]
        with:
          version: "0.13.6"
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        run: uv sync
      - name: Audit GitHub Actions workflows
        run: uv run zizmor .
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Configure environment
        run: uv run cli init-workspace
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and cache Docker images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: development
          load: true
          tags: |
            adit_dev-web:latest
            adit_dev-default_worker:latest
            adit_dev-dicom_worker:latest
            adit_dev-mass_transfer_worker:latest
            adit_dev-receiver:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start Docker containers
        run: uv run cli compose-up -- --detach --no-build
      - name: Run linting
        # https://github.com/actions/runner/issues/241#issuecomment-745902718
        shell: 'script -q -e -c "bash {0}"'
        run: uv run cli lint
      - name: Run tests
        shell: 'script -q -e -c "bash {0}"'
        run: uv run cli test -- --cov
      - name: Stop Docker containers
        if: ${{ always() }}
        run: uv run cli compose-down
