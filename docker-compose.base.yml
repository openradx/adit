x-app: &default-app
  volumes:
    - ${BACKUP_DIR:?}:/backups
    - ${MOUNT_DIR:?}:/mnt
  depends_on:
    - postgres
  env_file:
    - .env
  environment:
    DATABASE_URL: postgres://postgres:postgres@postgres.local:5432/postgres
    DBBACKUP_STORAGE_LOCATION: /backups
    IS_DOCKER_CONTAINER: 1
    FILE_TRANSMIT_HOST: receiver.local
    FILE_TRANSMIT_PORT: 14638
    # MOUNT_DIR from the .env file is the host path of the volume mapped to /mnt,
    # inside the containers the mount point itself is used.
    MOUNT_DIR: /mnt
    ORTHANC1_DICOM_PORT: 7501
    ORTHANC1_DICOMWEB_ROOT: dicom-web
    ORTHANC1_HOST: orthanc1.local
    ORTHANC1_HTTP_PORT: 6501
    ORTHANC2_DICOM_PORT: 7502
    ORTHANC2_DICOMWEB_ROOT: dicom-web
    ORTHANC2_HOST: orthanc2.local
    ORTHANC2_HTTP_PORT: 6502
    STORE_SCP_HOST: receiver.local
    STORE_SCP_PORT: 11112
    # STACK_NAME is computed by the CLI and passed as process environment variable,
    # it is not necessarily set in the .env file.
    STACK_NAME: ${STACK_NAME:-}

services:
  init:
    <<: *default-app
    hostname: init.local

  web:
    <<: *default-app
    build:
      args:
        - PROJECT_VERSION=${PROJECT_VERSION:?}
    hostname: web.local

  default_worker:
    <<: *default-app
    hostname: default_worker.local

  dicom_worker:
    <<: *default-app
    hostname: dicom_worker.local

  mass_transfer_worker:
    <<: *default-app
    hostname: mass_transfer_worker.local

  receiver:
    <<: *default-app
    hostname: receiver.local

  postgres:
    image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
    hostname: postgres.local
    volumes:
      - postgres_data:/var/lib/postgresql/data

  orthanc1:
    image: jodogne/orthanc-plugins:1.12.11@sha256:e7bffe0351cd391eacab8e78098e236efe6cafed987830e9b462b2050a0eae4a
    hostname: orthanc1.local
    configs:
      - source: orthanc1_config
        target: /etc/orthanc/orthanc.json
    volumes:
      - orthanc1_data:/var/lib/orthanc/db

  orthanc2:
    image: jodogne/orthanc-plugins:1.12.11@sha256:e7bffe0351cd391eacab8e78098e236efe6cafed987830e9b462b2050a0eae4a
    hostname: orthanc2.local
    configs:
      - source: orthanc2_config
        target: /etc/orthanc/orthanc.json
    volumes:
      - orthanc2_data:/var/lib/orthanc/db

configs:
  orthanc1_config:
    file: ./orthanc/orthanc1.json
  orthanc2_config:
    file: ./orthanc/orthanc2.json

volumes:
  postgres_data:
  orthanc1_data:
  orthanc2_data:
